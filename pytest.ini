[pytest]
minversion = 7.0
testpaths = tests
# Mirrors the sys.path setup api/main.py and agents/triage_graph.py do at
# runtime (inserting agents/ and graph/ so their bare `import cosmos_graph`
# / `import rag_retrieval` style imports resolve), so tests can import the
# same modules the app does without restructuring them into packages.
pythonpath = . agents graph
